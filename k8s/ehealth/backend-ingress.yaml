apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ehealth-backend-ingress
  namespace: ehealth
spec:
  ingressClassName: nginx
  rules:
    - host: api.ehealth.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
