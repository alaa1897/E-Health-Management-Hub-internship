# Copy this to database-secret.yaml, fill in real base64-encoded values, and
# kubectl apply -f it. The real file is gitignored and never committed.
# Encode a value with: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ehealth
type: Opaque
data:
  POSTGRES_PASSWORD: <base64-encoded-value>
  KEY: <base64-encoded-value>
